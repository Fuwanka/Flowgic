name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Следующий commit того же PR заменяет проверку устаревшего SHA.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-for-deployment
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],testserver
      DB_NAME: flowgic
      DB_USER: flowgic_test
      DB_PASSWORD: ci-test-password
      DB_TEST_USER: flowgic_test
      DB_TEST_PASSWORD: ci-test-password
      DB_TEST_NAME: test_flowgic
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: flowgic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d flowgic"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install GeoDjango and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libgeos-dev libproj-dev postgresql-client
          python -m pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Provision application and test roles
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: flowgic
          PGPASSWORD: ci-admin-password
          PGHOST: 127.0.0.1
          DB_USER: flowgic_app
          DB_PASSWORD: ci-app-password
        run: bash infra/postgres/20-flowgic.sh
      - name: Django checks and migration drift
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Validate OpenAPI and generated TypeScript client
        run: |
          python backend/manage.py export_openapi --output backend/openapi.json
          npm ci --prefix frontend-web --ignore-scripts --no-audit --no-fund
          npm run generate-api --prefix frontend-web
          npm run typecheck --prefix frontend-web
          npm test --prefix frontend-web
          npm run build --prefix frontend-web
          git diff --exit-code -- backend/openapi.json frontend-web/src/client
      - name: Full suite with migrations on fresh PostgreSQL/PostGIS
        run: python -m pytest --migrations --create-db --browser chromium --tb=short
